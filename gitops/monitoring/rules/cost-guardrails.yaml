# Cost is an SLO too when you run on EUR 100 of trial credit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cost-guardrails
  namespace: monitoring
spec:
  groups:
    - name: cost-guardrails
      rules:
        - alert: LabClusterRunningAfterHours
          # 20:00-05:00 UTC (22:00-07:00 Berlin summer time). Silence it during the soak week.
          expr: vector(1) and on() (hour() >= 20 or hour() < 5)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: The lab cluster is still running after hours (~EUR 0.22/h).
            description: Run scripts/cluster.sh down, or let the nightly cost-guardrail workflow stop it.
            runbook_url: https://github.com/OWNER/aks-platform-lab/blob/main/docs/runbooks.md#labclusterrunningafterhours

        - alert: LabNodeCountAboveBudget
          expr: count(kube_node_info) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} nodes are running; the budget assumes 2."
            description: Someone scaled a pool or an upgrade is stuck with a surge node. Check az aks nodepool list.
            runbook_url: https://github.com/OWNER/aks-platform-lab/blob/main/docs/runbooks.md#labnodecountabovebudget
