apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
spec:
  interval: 12h
  url: https://stefanprodan.github.io/podinfo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: podinfo
      version: "6.15.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
  install:
    remediation:
      retries: 3
  # Drill 8: push a broken value, watch helm-controller roll back automatically.
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
      strategy: rollback
      remediateLastFailure: true
  values:
    replicaCount: 2
    logLevel: info
    ui:
      message: "Platform lab: AKS + Flux + Gateway API + Prometheus"
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
    hpa:
      enabled: true
      maxReplicas: 4
      cpu: 70
    podDisruptionBudget:
      maxUnavailable: 1
    serviceMonitor:
      enabled: true
      interval: 15s
    httpRoute:
      enabled: true
      parentRefs:
        - name: public
          namespace: envoy-gateway-system
          sectionName: http
      hostnames: []
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
