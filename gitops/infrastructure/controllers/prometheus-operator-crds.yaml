# CRDs are installed separately from kube-prometheus-stack so that ESO, Envoy
# Gateway and apps can ship ServiceMonitors/PodMonitors BEFORE Prometheus exists,
# and so a kube-prometheus-stack rollback can never delete CRDs (and all rules).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "32.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
