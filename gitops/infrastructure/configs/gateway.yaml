apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1 # single user node; 2 replicas buy nothing but RAM here
        container:
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
      envoyService:
        # Cluster (default) keeps LB probing simple with one proxy replica.
        # Trade-off: client source IPs are SNATed. Switch to Local + >=2 replicas
        # spread across nodes when you need real client IPs.
        externalTrafficPolicy: Cluster
        annotations:
          # Azure LB defaults to an HTTP probe on "/" for HTTP app-protocols; Envoy
          # returns 404 there when no route matches "/", so the LB would mark all
          # backends down. Probe TCP instead.
          service.beta.kubernetes.io/port_80_health-probe_protocol: tcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: public
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.lab/gateway-access: public
