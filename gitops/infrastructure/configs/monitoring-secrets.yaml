# Must exist BEFORE kube-prometheus-stack installs (layer 3), otherwise the
# Grafana/Alertmanager pods sit in CreateContainerConfigError and the
# HelmRelease health check times out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: url # mounted at /etc/alertmanager/secrets/alertmanager-slack/url
      remoteRef:
        key: alertmanager-slack-webhook-url
