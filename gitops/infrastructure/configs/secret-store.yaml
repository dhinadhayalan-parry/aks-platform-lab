# One store for the cluster, authenticated with Entra Workload Identity: ESO
# requests a token for this service account, exchanges it for an Entra token
# (federated credential created by Terraform), and reads Key Vault. No secret
# material lives in Git or in Kubernetes to bootstrap this.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "${KEY_VAULT_URL}"
      tenantId: "${AZURE_TENANT_ID}"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
  conditions:
    - namespaces:
        - monitoring
